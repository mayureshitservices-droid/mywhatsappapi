version: '3'

services:
  whatsapp-api:
    build: .
    container_name: whatsapp-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./.wwebjs_auth:/usr/src/app/.wwebjs_auth
      - ./.wwebjs_cache:/usr/src/app/.wwebjs_cache
    shm_size: '2gb'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGODBURI=${MONGODBURI}
      - JWT_SECRET=${JWT_SECRET}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
